[project]
name = "DiffusionBlocks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7.0,<3",
    "torchvision>=0.22.0,<1",
    "lightning==2.5.0",
    "wandb==0.18.6",
    "transformers==4.52.4",
    "datasets==3.5.0",
    "huggingface-hub[hf-xet]>=0.31.2",
    "hf-transfer>=0.1.9",
    "scipy>=1.16.2",
]

[project.optional-dependencies]
# Not imported anywhere: vit.py sets the HF capability flags but no code passes
# attn_implementation="flash_attention_2", so sdpa is the path taken. Optional
# so the package installs on pre-Ampere hardware, where FA2 cannot build.
flash = ["flash-attn==2.7.4.post1"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'"}
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'"}
]
